<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="color-scheme" content="dark">
<title>Form Pemesanan | DewaTiket.id</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
:root{
    --bg:#050507; 
    --card:rgba(255,255,255,.025); 
    --card-h:rgba(255,255,255,.05);
    --bdr:rgba(255,255,255,.06); 
    --bdr-h:rgba(212,175,55,.3);
    --t1:#fff; --t2:rgba(255,255,255,.65); --t3:rgba(255,255,255,.35);
    --gold:#d4af37; --gold-l:#f5e7a0; --gold-d:#8a7022;
    --red:#e50024;
    --grd-gold:linear-gradient(135deg,#d4af37,#f5e7a0,#d4af37);
    --grd-red:linear-gradient(135deg,#e50024,#990018);
    --shadow:0 25px 70px rgba(0,0,0,.6);
    --r:16px; --r-lg:28px; --t:.4s cubic-bezier(0.4, 0, 0.2, 1);
    --h:70px; --bh:80px; --sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:calc(var(--bh) + 30px + var(--sb));overflow-x:hidden;-webkit-font-smoothing:antialiased;font-weight:400}

/* Ambient & Noise Background */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,rgba(229,0,36,.08),transparent 40%),radial-gradient(circle at 85% 80%,rgba(212,175,55,.06),transparent 45%);z-index:-2;pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:-1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none}

/* Header */
.header{position:sticky;top:0;z-index:1000;height:calc(var(--h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 28px 0;background:rgba(5,5,7,.7);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr)}
.header-left,.header-right{width:80px;display:flex;align-items:center}
.header-left{justify-content:flex-start} .header-right{justify-content:flex-end}
.logo{display:flex;align-items:center;height:36px;text-decoration:none;transition:var(--t)}
.logo:hover{transform:scale(1.03)}
.logo img{height:100%;width:auto;display:block;border-radius:4px}
.icon-btn{width:42px;height:42px;border:1px solid var(--bdr);background:rgba(255,255,255,.02);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--t)}
.icon-btn:hover{background:var(--card-h);border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Layout */
.container{width:100%;max-width:820px;margin:auto;padding:40px 20px 40px}

/* Step Indicator */
.step-indicator{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:48px;font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:2px}
.step-item{display:flex;align-items:center;gap:12px}
.step-num{width:32px;height:32px;background:transparent;border:1px solid var(--bdr-h);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:var(--t)}
.step-item.active{color:#fff}
.step-item.active .step-num{background:var(--grd-gold);color:#000;border-color:transparent;box-shadow:0 0 20px rgba(212,175,55,.3)}
.step-line{width:50px;height:1px;background:var(--bdr-h)}

/* Form Cards */
.form-card{background:var(--card);backdrop-filter:blur(15px);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:32px;margin-bottom:24px;box-shadow:0 10px 40px rgba(0,0,0,.2);animation:fadeUp .8s cubic-bezier(0.16, 1, 0.3, 1) backwards}
.form-card:nth-child(2){animation-delay:.1s} .form-card:nth-child(3){animation-delay:.2s} .form-card:nth-child(4){animation-delay:.3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.card-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--bdr);padding-bottom:20px}
.card-title i{color:var(--gold);font-size:14px;width:38px;height:38px;background:rgba(212,175,55,.05);border:1px solid rgba(212,175,55,.1);border-radius:12px;display:flex;align-items:center;justify-content:center}

/* Inputs */
.form-group{margin-bottom:20px}
.form-group label{display:block;font-weight:500;font-size:13px;margin-bottom:10px;color:var(--t2);letter-spacing:.5px}
.input-icon-wrap{position:relative;display:flex;align-items:center}
.input-icon{position:absolute;left:18px;font-size:14px;color:var(--t3);pointer-events:none;transition:var(--t)}
input,select,textarea{width:100%;padding:16px 18px 16px 48px;border-radius:14px;border:1px solid var(--bdr);background:rgba(255,255,255,.02);color:var(--t1);font-size:15px;transition:var(--t);font-family:'Plus Jakarta Sans',sans-serif;font-weight:400}
textarea{resize:vertical;min-height:100px;padding-left:18px;line-height:1.6}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 18px center;background-size:16px;cursor:pointer}
select option{background:#13131a;color:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.04);box-shadow:0 0 0 4px rgba(212,175,55,.05)}
.input-icon-wrap:focus-within .input-icon{color:var(--gold)}
input.error,select.error,textarea.error{border-color:var(--red);background:rgba(229,0,36,.03);box-shadow:0 0 0 4px rgba(229,0,36,.05);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Summary */
.summary-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;color:var(--t2);font-weight:300}
.summary-row strong{color:#fff;font-weight:500}
.summary-row.total{font-size:16px;font-weight:600;color:var(--t2);border-top:1px dashed var(--bdr-h);margin-top:16px;padding-top:24px}
.summary-row.total span{color:var(--gold-l);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;font-family:'Playfair Display',serif}

/* Custom Checkbox */
.check{display:flex;gap:14px;margin-top:16px;align-items:flex-start;background:rgba(255,255,255,.02);padding:16px;border-radius:14px;border:1px solid var(--bdr);cursor:pointer;transition:var(--t)}
.check:hover{border-color:var(--bdr-h);background:rgba(255,255,255,.04)}
.check input{position:absolute;opacity:0;width:0;height:0}
.check .checkbox-custom{width:22px;height:22px;min-width:22px;background:rgba(0,0,0,.3);border:1px solid var(--bdr-h);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:var(--t);margin-top:1px}
.check .checkbox-custom::after{content:'✓';color:#000;font-size:14px;font-weight:900;opacity:0;transform:scale(0);transition:var(--t)}
.check input:checked + .checkbox-custom{background:var(--grd-gold);border-color:transparent;box-shadow:0 0 15px rgba(212,175,55,.3)}
.check input:checked + .checkbox-custom::after{opacity:1;transform:scale(1)}
.check label{font-size:13px;color:var(--t2);cursor:pointer;line-height:1.6;font-weight:300}

/* Bottom Bar */
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:rgba(5,5,7,.85);backdrop-filter:blur(30px);padding:16px 20px calc(16px + var(--sb));border-top:1px solid var(--bdr)}
.bottom-inner{max-width:820px;margin:auto;height:80px;background:linear-gradient(90deg,#fff,rgba(255,255,255,.9));border-radius:18px;overflow:hidden;display:flex;align-items:stretch;box-shadow:0 15px 50px rgba(0,0,0,.7)}
.bottom-price{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 28px;color:#111;min-width:0}
.bottom-label{font-size:10px;font-weight:600;color:#666;margin-bottom:2px;text-transform:uppercase;letter-spacing:2px}
.bottom-total{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;font-family:'Playfair Display',serif}
.buy-btn{align-self:center;min-width:150px;height:56px;border:0;border-radius:14px;background:linear-gradient(135deg,#111,#333);color:var(--gold-l);font-size:13px;font-weight:700;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:2px;text-transform:uppercase;margin-right:16px;position:relative;overflow:hidden}
.buy-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.2),transparent);transition:.5s}
.buy-btn:hover::after{left:100%}
.buy-btn:active{transform:scale(.98)}
.buy-btn:disabled{opacity:.6;cursor:not-allowed}

/* UI Elements */
.loading-overlay{position:fixed;inset:0;z-index:9999;background:rgba(5,5,7,.98);backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;opacity:0;visibility:hidden;transition:opacity .4s}
.loading-overlay.active{opacity:1;visibility:visible}
.loader{width:80px;height:80px;position:relative}
.loader div{position:absolute;inset:0;border:2px solid transparent;border-radius:50%}
.loader div:nth-child(1){border-top-color:var(--gold);animation:spin 1s linear infinite}
.loader div:nth-child(2){inset:10px;border-right-color:var(--red);animation:spin 1.5s linear infinite reverse}
.loader div:nth-child(3){inset:20px;border-bottom-color:#fff;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:16px;font-weight:500;letter-spacing:2px;text-transform:uppercase}

.toast{position:fixed;top:calc(90px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(255,255,255,.95);backdrop-filter:blur(10px);color:#111;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:3000;opacity:0;transition:transform .4s,opacity .4s;max-width:90vw;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
    .container{padding:30px 16px 40px}
    .bottom-inner{height:70px}
    .bottom-total{font-size:22px}
    .buy-btn{min-width:130px;font-size:12px;height:50px;margin-right:12px;padding:0 16px}
    .form-card{padding:24px}
    .step-line{width:30px}
    .logo{height:30px}
}
</style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <button class="icon-btn" id="backBtn" aria-label="Kembali">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
    </div>
    <a href="index.html" class="logo" aria-label="DewaTiket Home"><img src="logo.png" alt="DewaTiket Logo"></a>
    <div class="header-right">
        <button class="icon-btn" id="helpBtn" aria-label="Bantuan">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
    </div>
</header>

<main class="container">
    <div class="step-indicator">
        <div class="step-item active"><div class="step-num">1</div><span>Data Diri</span></div>
        <div class="step-line"></div>
        <div class="step-item"><div class="step-num">2</div><span>Pembayaran</span></div>
    </div>

    <section class="form-card">
        <div class="card-title"><i class="fa-solid fa-receipt"></i> Ringkasan Pesanan</div>
        <div class="summary-row"><span>Jenis Tiket</span><strong id="jenisTiket">-</strong></div>
        <div id="detailTiket" style="margin-top:8px"></div>
        <div class="summary-row" style="margin-top:8px"><span>Jumlah Tiket</span><strong id="jumlahTiket">0</strong></div>
        <div class="summary-row total"><span>Total Pembayaran</span><span id="totalBayar">Rp 0</span></div>
    </section>

    <section class="form-card">
        <div class="card-title"><i class="fa-solid fa-user-pen"></i> Data Pemesan</div>
        <div class="form-group">
            <label>Nama Lengkap (sesuai identitas)</label>
            <div class="input-icon-wrap"><i class="fa-solid fa-user input-icon"></i><input id="nama" type="text" placeholder="Masukkan nama lengkap" maxlength="100" autocomplete="name"></div>
        </div>
        <div class="form-group">
            <label>Jenis Identitas</label>
            <div class="input-icon-wrap"><i class="fa-solid fa-id-card input-icon"></i><select id="identitas"><option value="">Pilih Identitas</option><option>KTP</option><option>SIM</option><option>Paspor</option><option>Kartu Pelajar</option></select></div>
        </div>
        <div class="form-group">
            <label>Nomor Identitas</label>
            <div class="input-icon-wrap"><i class="fa-solid fa-hashtag input-icon"></i><input id="nomorId" type="text" placeholder="Masukkan nomor identitas" maxlength="50"></div>
        </div>
        <div class="form-group">
            <label>E-mail Aktif</label>
            <div class="input-icon-wrap"><i class="fa-solid fa-envelope input-icon"></i><input id="email" type="email" placeholder="contoh@email.com" maxlength="100" autocomplete="email"></div>
        </div>
        <div class="form-group">
            <label>No. WhatsApp Aktif</label>
            <div class="input-icon-wrap"><i class="fa-solid fa-phone input-icon"></i><input id="wa" type="tel" placeholder="08xxxxxxxxxx" maxlength="15" autocomplete="tel"></div>
        </div>
        <div class="form-group">
            <label>Alamat / Tempat Tinggal</label>
            <div class="input-icon-wrap"><textarea id="alamat" placeholder="Masukkan alamat lengkap" maxlength="500"></textarea></div>
        </div>
    </section>

    <section class="form-card">
        <div class="card-title"><i class="fa-solid fa-shield-halved"></i> Persetujuan</div>
        <div class="check">
            <input type="checkbox" id="setuju1">
            <span class="checkbox-custom"></span>
            <label for="setuju1">Data yang saya isi adalah benar dan dapat dipertanggungjawabkan.</label>
        </div>
        <div class="check">
            <input type="checkbox" id="setuju2">
            <span class="checkbox-custom"></span>
            <label for="setuju2">Saya menyetujui syarat dan ketentuan acara serta kebijakan privasi.</label>
        </div>
    </section>
</main>

<div class="bottom-bar">
    <div class="bottom-inner">
        <div class="bottom-price">
            <div class="bottom-label">Total Bayar</div>
            <div class="bottom-total" id="bottomTotal">Rp 0</div>
        </div>
        <button class="buy-btn" id="lanjut">Lanjut <i class="fa-solid fa-arrow-right"></i></button>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loader"><div></div><div></div><div></div></div>
    <div class="loading-text">Memproses Pesanan</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Retrieve Cart Data
const selectedTickets = JSON.parse(localStorage.getItem('selectedTickets') || '[]');
const totalPrice = parseInt(localStorage.getItem('ticketTotal') || '0');
const cartItems = selectedTickets.map(t => ({name: t.name, qty: t.qty, harga: t.price, total: t.price * t.qty}));
const totalQty = cartItems.reduce((s, i) => s + i.qty, 0);

// DOM Refs
const $ = id => document.getElementById(id);
const namaEl = $('nama'), identitasEl = $('identitas'), nomorIdEl = $('nomorId'), 
      emailEl = $('email'), waEl = $('wa'), alamatEl = $('alamat'), 
      setuju1El = $('setuju1'), setuju2El = $('setuju2'), 
      lanjutBtn = $('lanjut'), toastEl = $('toast'), loadingOverlay = $('loadingOverlay');

const fmtTotal = 'Rp ' + totalPrice.toLocaleString('id-ID');
 $('totalBayar').innerText = fmtTotal;
 $('jumlahTiket').innerText = totalQty;
 $('bottomTotal').innerText = fmtTotal;

if (cartItems.length > 0) {
    let html = '', txt = [];
    cartItems.forEach(item => {
        html += `<div class="summary-row"><span style="color:var(--t3);font-size:13px">${item.name} (${item.qty}x)</span><strong>Rp ${item.total.toLocaleString('id-ID')}</strong></div>`;
        txt.push(item.name);
    });
    $('detailTiket').innerHTML = html;
    $('jenisTiket').innerText = txt.join(', ');
} else {
    $('jenisTiket').innerText = 'Tidak ada tiket dipilih';
}

// Draft Logic
function saveDraft() {
    try {
        ['nama','identitas','nomorId','email','wa','alamat'].forEach(f => localStorage.setItem('draft_'+f, $(f).value));
    } catch(e) {}
}
function restoreDraft() {
    try {
        ['nama','identitas','nomorId','email','wa','alamat'].forEach(f => $(f).value = localStorage.getItem('draft_'+f) || '');
    } catch(e) {}
}
restoreDraft();
[namaEl, identitasEl, nomorIdEl, emailEl, waEl, alamatEl].forEach(el => el.addEventListener('input', saveDraft));

// Toast
let toastTimer = null;
function showToast(msg) {
    toastEl.textContent = msg; 
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}

// Navigation
 $("backBtn").addEventListener("click", () => window.history.back());
 $("helpBtn").addEventListener("click", () => showToast("Hubungi WhatsApp: 0812-3456-7890"));

// Validation Logic
const isValidEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const isValidPhone = p => /^[0-9]{10,15}$/.test(p.replace(/[\s\-+]/g, ''));

lanjutBtn.addEventListener("click", () => {
    const wajib = [namaEl, identitasEl, nomorIdEl, emailEl, waEl, alamatEl];
    let isValid = true;
    wajib.forEach(f => f.classList.remove('error'));

    for (const f of wajib) { 
        if (!f.value.trim()) { f.classList.add('error'); isValid = false; } 
    }
    
    if (!isValid) {
        showToast('Mohon lengkapi semua data wajib (berwarna merah).');
        document.querySelector('.error').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }
    if (!isValidEmail(emailEl.value.trim())) { emailEl.classList.add('error'); showToast('Format email tidak valid.'); return; }
    if (!isValidPhone(waEl.value.trim())) { waEl.classList.add('error'); showToast('Nomor WhatsApp tidak valid.'); return; }
    if (!setuju1El.checked || !setuju2El.checked) { showToast('Harap centang seluruh kotak persetujuan.'); return; }

    lanjutBtn.disabled = true;
    lanjutBtn.innerHTML = 'Memproses...';
    loadingOverlay.classList.add('active');

    const orderId = 'SPECTRA-' + Date.now();
    const orderData = {
        event: "Spectra Fest 2026", nama: namaEl.value.trim(), wa: waEl.value.trim(), email: emailEl.value.trim(),
        identitas: identitasEl.value, nomor_id: nomorIdEl.value.trim(), alamat: alamatEl.value.trim(),
        detail_pesanan: cartItems, jumlah_tiket: totalQty, total_bayar: totalPrice
    };

    try {
        localStorage.setItem('protix_order', JSON.stringify(orderData));
        localStorage.setItem('orderId', orderId);
        // Clean draft
        ['nama','identitas','nomorId','email','wa','alamat'].forEach(f => localStorage.removeItem('draft_'+f));
    } catch(e) {}

    const qrisParams = new URLSearchParams({ 
        nama: orderData.nama, 
        wa: orderData.wa, 
        totalQty: totalQty, 
        total: totalPrice, 
        orderId: orderId 
    });
    
    setTimeout(() => { 
        window.location.href = 'qris.html?' + qrisParams.toString(); 
    }, 1200);
});
</script>
</body>
</html>
